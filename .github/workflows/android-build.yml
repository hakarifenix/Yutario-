name: Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Build web application
        run: npm run build

      - name: Verify web build output
        run: |
          test -f dist/index.html
          test -n "$(find dist/assets -name '*.js' -size +10k -print -quit)"

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Android SDK at $SDK"
          SDKMANAGER=$(find "$SDK" -path '*/cmdline-tools/*/bin/sdkmanager' -print -quit)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          if [ ! -s "$APK" ]; then
            echo "::error::APK was not produced at $APK"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          {
            echo "### Yutario debug APK"
            echo ""
            echo "- Size: $((SIZE / 1024 / 1024)) MB ($SIZE bytes)"
            echo "- Artifact: \`yutario-debug-apk\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yutario-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
